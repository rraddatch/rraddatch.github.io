<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 720"
     width="1200"
     height="720"
     role="graphics-document"
     aria-labelledby="tree-title tree-desc">

  <title id="tree-title">Accessibility tree of the example HTML document</title>
  <desc id="tree-desc">
    The diagram shows a simplified representation of the accessibility tree
    for an HTML document with the title My document, a level-one heading Heading, and a paragraph Paragraph.
    The root object is document with the name My document.
    Document has two children.
    The first is heading level 1 with the name Heading and a text leaf child named Heading.
    The second is paragraph with an empty name and a text leaf child named Paragraph.
    Solid arrows represent the hierarchical parent-child relationship.
  </desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>

    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: currentColor;
      }

      .root {
        fill: white;
        stroke: currentColor;
        stroke-width: 4;
      }

      .root-inner {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }

      .node {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
      }

      .leaf {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
        stroke-dasharray: 10 7;
      }

      .edge {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        marker-end: url(#arrow);
      }

      .title {
        font-size: 28px;
        font-weight: 700;
      }

      .property {
        font-size: 20px;
      }

      .leaf-title {
        font-size: 22px;
        font-weight: 700;
      }

      .leaf-name {
        font-size: 20px;
      }
    </style>
  </defs>

  <g aria-hidden="true">
    <path class="edge" d="M600 150 L600 220 L350 220 L350 300"/>
    <path class="edge" d="M600 150 L600 220 L850 220 L850 300"/>
    <path class="edge" d="M350 445 L350 520"/>
    <path class="edge" d="M850 445 L850 520"/>
  </g>

  <g role="graphics-object" aria-labelledby="document-title document-desc">
    <title id="document-title">document</title>
    <desc id="document-desc">
      Root object of the accessibility tree.
      Its name is My document.
      Its direct children are heading level 1 and paragraph.
    </desc>

    <rect class="root"
          x="450" y="40"
          width="300" height="110"
          rx="16"/>

    <rect class="root-inner"
          x="460" y="50"
          width="280" height="90"
          rx="11"/>

    <text class="title"
          x="600" y="88"
          text-anchor="middle">document</text>

    <text class="property"
          x="600" y="122"
          text-anchor="middle">name: "My document"</text>
  </g>

  <g role="graphics-object" aria-labelledby="heading-title heading-desc">
    <title id="heading-title">heading level 1</title>
    <desc id="heading-desc">
      The heading object is a child of the document object.
      It has level 1 and the name Heading.
      Its child is a text leaf named Heading.
    </desc>

    <rect class="node"
          x="180" y="300"
          width="340" height="145"
          rx="16"/>

    <text class="title"
          x="350" y="345"
          text-anchor="middle">heading</text>

    <text class="property"
          x="350" y="380"
          text-anchor="middle">level: 1</text>

    <text class="property"
          x="350" y="415"
          text-anchor="middle">name: "Heading"</text>
  </g>

  <g role="graphics-object" aria-labelledby="paragraph-title paragraph-desc">
    <title id="paragraph-title">paragraph</title>
    <desc id="paragraph-desc">
      The paragraph object is a child of the document object.
      It has an empty name.
      Its child is a text leaf named Paragraph.
    </desc>

    <rect class="node"
          x="680" y="300"
          width="340" height="145"
          rx="16"/>

    <text class="title"
          x="850" y="355"
          text-anchor="middle">paragraph</text>

    <text class="property"
          x="850" y="400"
          text-anchor="middle">name: ""</text>
  </g>

  <g role="graphics-object" aria-labelledby="heading-leaf-title heading-leaf-desc">
    <title id="heading-leaf-title">text leaf Heading</title>
    <desc id="heading-leaf-desc">
      The text leaf object is a child of the heading object.
      Its name is Heading.
    </desc>

    <rect class="leaf"
          x="225" y="520"
          width="250" height="105"
          rx="52"/>

    <text class="leaf-title"
          x="350" y="562"
          text-anchor="middle">text leaf</text>

    <text class="leaf-name"
          x="350" y="596"
          text-anchor="middle">name: "Heading"</text>
  </g>

  <g role="graphics-object" aria-labelledby="paragraph-leaf-title paragraph-leaf-desc">
    <title id="paragraph-leaf-title">text leaf Paragraph</title>
    <desc id="paragraph-leaf-desc">
      The text leaf object is a child of the paragraph object.
      Its name is Paragraph.
    </desc>

    <rect class="leaf"
          x="725" y="520"
          width="250" height="105"
          rx="52"/>

    <text class="leaf-title"
          x="850" y="562"
          text-anchor="middle">text leaf</text>

    <text class="leaf-name"
          x="850" y="596"
          text-anchor="middle">name: "Paragraph"</text>
  </g>

</svg>
