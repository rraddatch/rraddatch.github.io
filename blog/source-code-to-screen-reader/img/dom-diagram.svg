<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 820"
     width="1200"
     height="820"
     role="graphics-document"
     aria-labelledby="dom-title dom-desc">

  <title id="dom-title">DOM tree of the example HTML document</title>
  <desc id="dom-desc">
    The diagram shows the hierarchical DOM structure created from the HTML document.
    The root object is Document. Its child is the html element with a lang attribute equal to en.
    The html element has two direct children: head and body.
    The head element contains a title element, which contains the text node My document.
    The body element contains an h1 element with the text node Heading and a p element with the text node Paragraph.
    Solid arrows represent the parent-child relationship.
    Text nodes are visually distinguished by an oval shape and a dashed outline.
  </desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>

    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: currentColor;
      }

      .document-node {
        fill: white;
        stroke: currentColor;
        stroke-width: 4;
      }

      .document-inner {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }

      .element-node {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
      }

      .text-node {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
        stroke-dasharray: 10 7;
      }

      .edge {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        marker-end: url(#arrow);
      }

      .node-title {
        font-size: 27px;
        font-weight: 700;
      }

      .attribute {
        font-size: 19px;
      }

      .text-label {
        font-size: 21px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Edges are decorative; their meaning is described on the objects and in the SVG description. -->
  <g aria-hidden="true">
    <path class="edge" d="M600 130 L600 190"/>
    <path class="edge" d="M600 310 L600 365 L300 365 L300 420"/>
    <path class="edge" d="M600 310 L600 365 L900 365 L900 420"/>
    <path class="edge" d="M300 520 L300 570"/>
    <path class="edge" d="M900 520 L900 565 L760 565 L760 610"/>
    <path class="edge" d="M900 520 L900 565 L1040 565 L1040 610"/>
    <path class="edge" d="M300 690 L300 725"/>
    <path class="edge" d="M760 690 L760 725"/>
    <path class="edge" d="M1040 690 L1040 725"/>
  </g>

  <!-- Document -->
  <g role="graphics-object" aria-labelledby="document-title document-desc">
    <title id="document-title">Document</title>
    <desc id="document-desc">
      Root object of the DOM. Its direct child is the html element.
    </desc>

    <rect class="document-node"
          x="485" y="40"
          width="230" height="90"
          rx="16"/>

    <rect class="document-inner"
          x="495" y="50"
          width="210" height="70"
          rx="11"/>

    <text class="node-title"
          x="600" y="95"
          text-anchor="middle">Document</text>
  </g>

  <!-- HTML -->
  <g role="graphics-object" aria-labelledby="html-title html-desc">
    <title id="html-title">The html element</title>
    <desc id="html-desc">
      The html element is a child of the Document object.
      It has a lang attribute with the value en.
      Its direct children are the head and body elements.
    </desc>

    <rect class="element-node"
          x="475" y="190"
          width="250" height="120"
          rx="16"/>

    <text class="node-title"
          x="600" y="235"
          text-anchor="middle">html</text>

    <line x1="505" y1="255"
          x2="695" y2="255"
          stroke="currentColor"
          stroke-width="2"/>

    <text class="attribute"
          x="600" y="290"
          text-anchor="middle">lang="en"</text>
  </g>

  <!-- HEAD -->
  <g role="graphics-object" aria-labelledby="head-title head-desc">
    <title id="head-title">The head element</title>
    <desc id="head-desc">
      The head element is a child of the html element.
      Its direct child is the title element.
    </desc>

    <rect class="element-node"
          x="190" y="420"
          width="220" height="100"
          rx="16"/>

    <text class="node-title"
          x="300" y="480"
          text-anchor="middle">head</text>
  </g>

  <!-- BODY -->
  <g role="graphics-object" aria-labelledby="body-title body-desc">
    <title id="body-title">The body element</title>
    <desc id="body-desc">
      The body element is a child of the html element.
      Its direct children are the h1 and p elements.
    </desc>

    <rect class="element-node"
          x="790" y="420"
          width="220" height="100"
          rx="16"/>

    <text class="node-title"
          x="900" y="480"
          text-anchor="middle">body</text>
  </g>

  <!-- TITLE -->
  <g role="graphics-object" aria-labelledby="title-title title-desc">
    <title id="title-title">The title element</title>
    <desc id="title-desc">
      The title element is a child of the head element.
      It contains the text node My document.
    </desc>

    <rect class="element-node"
          x="190" y="590"
          width="220" height="100"
          rx="16"/>

    <text class="node-title"
          x="300" y="650"
          text-anchor="middle">title</text>
  </g>

  <!-- H1 -->
  <g role="graphics-object" aria-labelledby="h1-title h1-desc">
    <title id="h1-title">The h1 element</title>
    <desc id="h1-desc">
      The h1 element is a child of the body element.
      It contains the text node Heading.
    </desc>

    <rect class="element-node"
          x="650" y="590"
          width="220" height="100"
          rx="16"/>

    <text class="node-title"
          x="760" y="650"
          text-anchor="middle">h1</text>
  </g>

  <!-- P -->
  <g role="graphics-object" aria-labelledby="p-title p-desc">
    <title id="p-title">The p element</title>
    <desc id="p-desc">
      The p element is a child of the body element.
      It contains the text node Paragraph.
    </desc>

    <rect class="element-node"
          x="930" y="590"
          width="220" height="100"
          rx="16"/>

    <text class="node-title"
          x="1040" y="650"
          text-anchor="middle">p</text>
  </g>

  <!-- Text nodes -->
  <g role="graphics-object" aria-labelledby="text-document-title text-document-desc">
    <title id="text-document-title">Text node My document</title>
    <desc id="text-document-desc">
      Text content of the title element.
    </desc>

    <rect class="text-node"
          x="175" y="725"
          width="250" height="70"
          rx="35"/>

    <text class="text-label"
          x="300" y="768"
          text-anchor="middle">"My document"</text>
  </g>

  <g role="graphics-object" aria-labelledby="text-heading-title text-heading-desc">
    <title id="text-heading-title">Text node Heading</title>
    <desc id="text-heading-desc">
      Text content of the h1 element.
    </desc>

    <rect class="text-node"
          x="650" y="725"
          width="220" height="70"
          rx="35"/>

    <text class="text-label"
          x="760" y="768"
          text-anchor="middle">"Heading"</text>
  </g>

  <g role="graphics-object" aria-labelledby="text-paragraph-title text-paragraph-desc">
    <title id="text-paragraph-title">Text node Paragraph</title>
    <desc id="text-paragraph-desc">
      Text content of the p element.
    </desc>

    <rect class="text-node"
          x="930" y="725"
          width="220" height="70"
          rx="35"/>

    <text class="text-label"
          x="1040" y="768"
          text-anchor="middle">"Paragraph"</text>
  </g>
</svg>
