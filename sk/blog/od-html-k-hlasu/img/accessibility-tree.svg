<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 720"
     width="1200"
     height="720"
     role="graphics-document"
     aria-labelledby="tree-title tree-desc">

  <title id="tree-title">Accessibility tree vo Firefox Accessibility Inspector</title>
  <desc id="tree-desc">
    Diagram zobrazuje zjednodušenú reprezentáciu accessibility tree podľa Firefox Accessibility Inspector
    pre HTML dokument s titulkom Môj dokument, nadpisom prvej úrovne Nadpis a odsekom Odsek.
    Koreňovým objektom je document s názvom Môj dokument.
    Document má dvoch potomkov.
    Prvým je heading úrovne 1 s názvom Nadpis a potomkom text leaf s názvom Nadpis.
    Druhým je paragraph s prázdnym názvom a potomkom text leaf s názvom Odsek.
    Plné spojnice so šípkou znázorňujú hierarchický vzťah rodiča a potomka.
  </desc>

  <defs>
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
    </marker>

    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        fill: currentColor;
      }

      .root {
        fill: white;
        stroke: currentColor;
        stroke-width: 4;
      }

      .root-inner {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }

      .node {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
      }

      .leaf {
        fill: white;
        stroke: currentColor;
        stroke-width: 3;
        stroke-dasharray: 10 7;
      }

      .edge {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        marker-end: url(#arrow);
      }

      .title {
        font-size: 28px;
        font-weight: 700;
      }

      .property {
        font-size: 20px;
      }

      .leaf-title {
        font-size: 22px;
        font-weight: 700;
      }

      .leaf-name {
        font-size: 20px;
      }
    </style>
  </defs>

  <g aria-hidden="true">
    <path class="edge" d="M600 150 L600 220 L350 220 L350 300"/>
    <path class="edge" d="M600 150 L600 220 L850 220 L850 300"/>
    <path class="edge" d="M350 445 L350 520"/>
    <path class="edge" d="M850 445 L850 520"/>
  </g>

  <g role="graphics-object" aria-labelledby="document-title document-desc">
    <title id="document-title">document</title>
    <desc id="document-desc">
      Koreňový objekt accessibility tree.
      Má názov Môj dokument.
      Jeho priamymi potomkami sú heading úrovne 1 a paragraph.
    </desc>

    <rect class="root"
          x="450" y="40"
          width="300" height="110"
          rx="16"/>

    <rect class="root-inner"
          x="460" y="50"
          width="280" height="90"
          rx="11"/>

    <text class="title"
          x="600" y="88"
          text-anchor="middle">document</text>

    <text class="property"
          x="600" y="122"
          text-anchor="middle">názov: "Môj dokument"</text>
  </g>

  <g role="graphics-object" aria-labelledby="heading-title heading-desc">
    <title id="heading-title">heading úrovne 1</title>
    <desc id="heading-desc">
      Objekt heading je potomkom objektu document.
      Má úroveň 1 a názov Nadpis.
      Jeho potomkom je text leaf s názvom Nadpis.
    </desc>

    <rect class="node"
          x="180" y="300"
          width="340" height="145"
          rx="16"/>

    <text class="title"
          x="350" y="345"
          text-anchor="middle">heading</text>

    <text class="property"
          x="350" y="380"
          text-anchor="middle">level: 1</text>

    <text class="property"
          x="350" y="415"
          text-anchor="middle">názov: "Nadpis"</text>
  </g>

  <g role="graphics-object" aria-labelledby="paragraph-title paragraph-desc">
    <title id="paragraph-title">paragraph</title>
    <desc id="paragraph-desc">
      Objekt paragraph je potomkom objektu document.
      Má prázdny názov.
      Jeho potomkom je text leaf s názvom Odsek.
    </desc>

    <rect class="node"
          x="680" y="300"
          width="340" height="145"
          rx="16"/>

    <text class="title"
          x="850" y="355"
          text-anchor="middle">paragraph</text>

    <text class="property"
          x="850" y="400"
          text-anchor="middle">názov: ""</text>
  </g>

  <g role="graphics-object" aria-labelledby="heading-leaf-title heading-leaf-desc">
    <title id="heading-leaf-title">text leaf Nadpis</title>
    <desc id="heading-leaf-desc">
      Textový objekt text leaf je potomkom objektu heading.
      Má názov Nadpis.
    </desc>

    <rect class="leaf"
          x="225" y="520"
          width="250" height="105"
          rx="52"/>

    <text class="leaf-title"
          x="350" y="562"
          text-anchor="middle">text leaf</text>

    <text class="leaf-name"
          x="350" y="596"
          text-anchor="middle">názov: "Nadpis"</text>
  </g>

  <g role="graphics-object" aria-labelledby="paragraph-leaf-title paragraph-leaf-desc">
    <title id="paragraph-leaf-title">text leaf Odsek</title>
    <desc id="paragraph-leaf-desc">
      Textový objekt text leaf je potomkom objektu paragraph.
      Má názov Odsek.
    </desc>

    <rect class="leaf"
          x="725" y="520"
          width="250" height="105"
          rx="52"/>

    <text class="leaf-title"
          x="850" y="562"
          text-anchor="middle">text leaf</text>

    <text class="leaf-name"
          x="850" y="596"
          text-anchor="middle">názov: "Odsek"</text>
  </g>

</svg>
